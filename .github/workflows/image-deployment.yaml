name: Publish Docker image

on:
    push:
        tags:
            - "v*.*.*"

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract version and SHA
              id: meta
              run: |
                  VERSION=${GITHUB_REF#refs/tags/}
                  SHORT_SHA=$(git rev-parse --short HEAD)
                  IMAGE_NAME="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT
                  echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  tags: |
                      ${{ steps.meta.outputs.image_name }}:latest
                      ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.version }}
                      ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.sha }}
